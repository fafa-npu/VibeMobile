name: vibe_mobile_desktop
description: "VibeMobile Desktop - Local management app for Claude Code sessions"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter

  # State management - Riverpod 2.0
  flutter_riverpod: ^2.5.0
  riverpod_annotation: ^2.3.0

  # Routing
  go_router: ^14.0.0

  # Code Generation support
  freezed_annotation: ^2.4.0
  json_annotation: ^4.8.0

  # Local storage
  hive: ^2.2.0
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.0  # Keep for migration

  # HTTP client
  http: ^1.2.0

  # WebSocket
  web_socket_channel: ^3.0.0

  # URL launcher
  url_launcher: ^6.3.0

  # File picker
  file_picker: ^8.0.0

  # Date formatting
  intl: ^0.19.0

  # Path provider
  path_provider: ^2.1.0

  # Window management
  window_manager: ^0.3.9

  # Logging
  logger: ^2.0.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Code generation
  build_runner: ^2.4.0
  riverpod_generator: ^2.4.0
  freezed: ^2.4.0
  json_serializable: ^6.7.0
  hive_generator: ^2.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
