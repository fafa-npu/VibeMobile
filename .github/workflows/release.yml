name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: true
        default: 'v0.0.0'

jobs:
  build:
    name: Build macOS App with Bundled Server
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ===== Build Web Server =====
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Build web server
        working-directory: web
        run: npm run build

      # ===== Build macOS App =====
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Install Flutter dependencies
        working-directory: desktop
        run: flutter pub get

      - name: Build macOS app
        working-directory: desktop
        run: flutter build macos --release

      # ===== Bundle Server into App =====
      - name: Bundle server into app
        run: |
          APP_PATH="desktop/build/macos/Build/Products/Release/VibeMobile.app"
          SERVER_DIR="$APP_PATH/Contents/Resources/server"

          # Create server directory in app bundle
          mkdir -p "$SERVER_DIR"

          # Copy server files
          cp web/dist/server.cjs "$SERVER_DIR/"

          # Copy frontend static files (dist folder contents except server.cjs)
          mkdir -p "$SERVER_DIR/dist"
          cp -R web/dist/* "$SERVER_DIR/dist/" 2>/dev/null || true

          # Verify bundle
          echo "=== Bundled server files ==="
          ls -la "$SERVER_DIR/"
          echo "=== Bundled dist files ==="
          ls -la "$SERVER_DIR/dist/" | head -20

      # ===== Import Certificate =====
      - name: Import Code Signing Certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
        run: |
          # Create temporary keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          # Create keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import certificate
          echo "$CERTIFICATE_BASE64" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"

          # Add keychain to search list
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          # Allow codesign to access the key
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Verify certificate is available
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      # ===== Sign App with Developer ID =====
      - name: Sign app with Developer ID
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          APP_PATH="desktop/build/macos/Build/Products/Release/VibeMobile.app"
          IDENTITY="Developer ID Application: Hua Zhao ($APPLE_TEAM_ID)"

          # Remove any existing signatures and extended attributes
          xattr -cr "$APP_PATH"

          # Sign all nested frameworks and libraries first (inside-out signing)
          echo "Signing nested components..."
          find "$APP_PATH/Contents/Frameworks" -type f -perm +111 -exec codesign --force --options runtime --sign "$IDENTITY" {} \; 2>/dev/null || true
          find "$APP_PATH/Contents/Frameworks" -name "*.dylib" -exec codesign --force --options runtime --sign "$IDENTITY" {} \; 2>/dev/null || true
          find "$APP_PATH/Contents/Frameworks" -name "*.framework" -exec codesign --force --options runtime --sign "$IDENTITY" {} \; 2>/dev/null || true

          # Sign any helper apps or XPC services
          find "$APP_PATH/Contents/XPCServices" -name "*.xpc" -exec codesign --force --options runtime --sign "$IDENTITY" {} \; 2>/dev/null || true
          find "$APP_PATH/Contents/MacOS" -type f -perm +111 ! -name "VibeMobile" -exec codesign --force --options runtime --sign "$IDENTITY" {} \; 2>/dev/null || true

          # Sign the main app bundle
          echo "Signing main app bundle..."
          codesign --force --options runtime \
            --sign "$IDENTITY" \
            "$APP_PATH"

          # Verify the signature
          echo "Verifying signature..."
          codesign --verify --verbose=2 "$APP_PATH"
          codesign -dv --verbose=4 "$APP_PATH"
          echo "App signed successfully!"

      # ===== Create and Sign DMG =====
      - name: Create and Sign DMG
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cd desktop/build/macos/Build/Products/Release

          # Create a temporary directory for DMG contents
          mkdir -p dmg_contents
          cp -R VibeMobile.app dmg_contents/

          # Create symlink to Applications
          ln -s /Applications dmg_contents/Applications

          # Create DMG
          hdiutil create -volname "VibeMobile" \
            -srcfolder dmg_contents \
            -ov -format UDZO \
            VibeMobile.dmg

          # Sign the DMG (required for notarization)
          echo "Signing DMG..."
          codesign --force --sign "Developer ID Application: Hua Zhao ($APPLE_TEAM_ID)" VibeMobile.dmg
          codesign --verify --verbose VibeMobile.dmg
          echo "DMG signed successfully!"

          # Move DMG to workspace root
          mv VibeMobile.dmg $GITHUB_WORKSPACE/

      # ===== Notarize DMG =====
      - name: Notarize DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Submit for notarization and capture the submission ID
          echo "Submitting for notarization..."
          SUBMISSION_OUTPUT=$(xcrun notarytool submit VibeMobile.dmg \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait 2>&1) || true

          echo "$SUBMISSION_OUTPUT"

          # Extract submission ID
          SUBMISSION_ID=$(echo "$SUBMISSION_OUTPUT" | grep -o 'id: [a-f0-9-]*' | head -1 | cut -d' ' -f2)

          # Check if notarization was successful
          if echo "$SUBMISSION_OUTPUT" | grep -q "status: Accepted"; then
            echo "Notarization successful!"
          else
            echo "Notarization may have failed. Fetching detailed log..."
            if [ -n "$SUBMISSION_ID" ]; then
              xcrun notarytool log "$SUBMISSION_ID" \
                --apple-id "$APPLE_ID" \
                --password "$APPLE_APP_PASSWORD" \
                --team-id "$APPLE_TEAM_ID" || true
            fi
            # Exit with error if not accepted
            if ! echo "$SUBMISSION_OUTPUT" | grep -q "status: Accepted"; then
              echo "Notarization failed!"
              exit 1
            fi
          fi

          # Staple the notarization ticket
          echo "Stapling notarization ticket..."
          xcrun stapler staple VibeMobile.dmg

          # Verify
          echo "Verifying notarization..."
          spctl --assess --type open --context context:primary-signature -v VibeMobile.dmg || true
          echo "Notarization complete!"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VibeMobile-macOS
          path: VibeMobile.dmg

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: VibeMobile-macOS

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: VibeMobile ${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          files: VibeMobile.dmg
          body: |
            ## VibeMobile ${{ steps.version.outputs.version }}

            Remote control for Claude Code sessions from your phone.

            ### Installation

            1. Download `VibeMobile.dmg`
            2. Open DMG and drag VibeMobile to Applications
            3. Run VibeMobile from Applications

            **That's it!** The app is signed and notarized by Apple.

            ### Requirements

            - macOS 12.0+
            - Node.js 18+ (`brew install node`)
            - tmux (`brew install tmux`)

            ### Usage

            1. Open VibeMobile app
            2. Click "Start Server"
            3. Click "New Session" to create a Claude Code session
            4. Connect from your phone: `http://YOUR_MAC_IP:8765`
            5. Pair your device using the 6-digit code

            See [README](https://github.com/${{ github.repository }}#readme) for full documentation.
