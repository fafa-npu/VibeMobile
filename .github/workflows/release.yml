name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: true
        default: 'v0.0.0'

jobs:
  build-macos:
    name: Build macOS App with Bundled Server
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ===== Build Web Server =====
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Build web server
        working-directory: web
        run: npm run build

      # ===== Build macOS App =====
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Install Flutter dependencies
        working-directory: desktop
        run: flutter pub get

      - name: Build macOS app
        working-directory: desktop
        run: flutter build macos --release

      # ===== Bundle Server into App =====
      - name: Bundle server into app
        run: |
          APP_PATH="desktop/build/macos/Build/Products/Release/VibeMobile.app"
          SERVER_DIR="$APP_PATH/Contents/Resources/server"

          # Create server directory in app bundle
          mkdir -p "$SERVER_DIR"

          # Copy server files
          cp web/dist/server.cjs "$SERVER_DIR/"

          # Copy frontend static files (dist folder contents except server.cjs)
          mkdir -p "$SERVER_DIR/dist"
          cp -R web/dist/* "$SERVER_DIR/dist/" 2>/dev/null || true

          # Verify bundle
          echo "=== Bundled server files ==="
          ls -la "$SERVER_DIR/"
          echo "=== Bundled dist files ==="
          ls -la "$SERVER_DIR/dist/" | head -20

      # ===== Import Certificate =====
      - name: Import Code Signing Certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
        run: |
          # Create temporary keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          # Create keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import certificate
          echo "$CERTIFICATE_BASE64" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"

          # Add keychain to search list
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          # Allow codesign to access the key
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Verify certificate is available
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      # ===== Sign App with Developer ID =====
      - name: Sign app with Developer ID
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          APP_PATH="desktop/build/macos/Build/Products/Release/VibeMobile.app"
          SIGN_IDENTITY="Developer ID Application: Hua Zhao ($APPLE_TEAM_ID)"
          ENTITLEMENTS="desktop/macos/Runner/Release.entitlements"

          # Remove any existing signatures and extended attributes
          xattr -cr "$APP_PATH"

          echo "=== Signing nested components (inside-out) ==="

          # Sign all frameworks first (from innermost to outermost)
          find "$APP_PATH/Contents/Frameworks" -name "*.framework" -type d 2>/dev/null | while read framework; do
            echo "Signing framework: $framework"
            codesign --force --options runtime --sign "$SIGN_IDENTITY" "$framework"
          done

          # Sign all dylibs
          find "$APP_PATH" -name "*.dylib" -type f 2>/dev/null | while read dylib; do
            echo "Signing dylib: $dylib"
            codesign --force --options runtime --sign "$SIGN_IDENTITY" "$dylib"
          done

          # Sign all embedded executables in Helpers or MacOS subdirectories
          find "$APP_PATH/Contents" -type f -perm +111 ! -name "*.dylib" 2>/dev/null | while read exe; do
            # Skip the main executable, we'll sign it with the app
            if [[ "$exe" != "$APP_PATH/Contents/MacOS/"* ]]; then
              echo "Signing executable: $exe"
              codesign --force --options runtime --sign "$SIGN_IDENTITY" "$exe"
            fi
          done

          # Sign the main app bundle with entitlements
          echo "=== Signing main app bundle ==="
          codesign --force --options runtime \
            --entitlements "$ENTITLEMENTS" \
            --sign "$SIGN_IDENTITY" \
            "$APP_PATH"

          # Verify the signature
          echo "=== Verifying signature ==="
          codesign --verify --verbose=2 "$APP_PATH"

          # Check for any unsigned code
          echo "=== Checking for unsigned code ==="
          codesign --verify --deep --strict --verbose=2 "$APP_PATH" 2>&1 || true

          echo "App signed successfully!"

      # ===== Create and Sign DMG =====
      - name: Create and Sign DMG
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cd desktop/build/macos/Build/Products/Release

          # Create a temporary directory for DMG contents
          mkdir -p dmg_contents
          cp -R VibeMobile.app dmg_contents/

          # Create symlink to Applications
          ln -s /Applications dmg_contents/Applications

          # Create DMG
          hdiutil create -volname "VibeMobile" \
            -srcfolder dmg_contents \
            -ov -format UDZO \
            VibeMobile.dmg

          # Sign the DMG
          echo "Signing DMG..."
          codesign --force --sign "Developer ID Application: Hua Zhao ($APPLE_TEAM_ID)" VibeMobile.dmg

          # Verify DMG signature
          codesign --verify --verbose VibeMobile.dmg

          # Move DMG to workspace root
          mv VibeMobile.dmg $GITHUB_WORKSPACE/

      # ===== Notarize DMG =====
      - name: Notarize DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        timeout-minutes: 60
        run: |
          # Function to check notarization status
          check_status() {
            local submission_id=$1
            xcrun notarytool info "$submission_id" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_APP_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --output-format json 2>&1
          }

          # Submit for notarization WITHOUT --wait (async submission)
          echo "Submitting for notarization..."
          SUBMIT_OUTPUT=$(xcrun notarytool submit VibeMobile.dmg \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --output-format json 2>&1)

          echo "Submission output: $SUBMIT_OUTPUT"

          # Extract submission ID
          SUBMISSION_ID=$(echo "$SUBMIT_OUTPUT" | grep -o '"id" *: *"[^"]*"' | head -1 | sed 's/.*: *"\([^"]*\)".*/\1/')

          if [ -z "$SUBMISSION_ID" ]; then
            echo "ERROR: Failed to get submission ID"
            echo "Output was: $SUBMIT_OUTPUT"
            exit 1
          fi

          echo "Submission ID: $SUBMISSION_ID"
          echo "SUBMISSION_ID=$SUBMISSION_ID" >> $GITHUB_ENV

          # Poll for completion with exponential backoff
          echo "Waiting for Apple to process notarization..."
          MAX_ATTEMPTS=60  # 60 attempts
          INITIAL_WAIT=30  # Start with 30 seconds
          MAX_WAIT=120     # Max wait of 2 minutes between polls
          ATTEMPT=1
          WAIT_TIME=$INITIAL_WAIT

          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            echo "=== Attempt $ATTEMPT/$MAX_ATTEMPTS (waiting ${WAIT_TIME}s before check) ==="
            sleep $WAIT_TIME

            # Check status
            STATUS_OUTPUT=$(check_status "$SUBMISSION_ID" || echo '{"status":"Error"}')
            echo "Status output: $STATUS_OUTPUT"

            STATUS=$(echo "$STATUS_OUTPUT" | grep -o '"status" *: *"[^"]*"' | head -1 | sed 's/.*: *"\([^"]*\)".*/\1/' || echo "Unknown")
            echo "Current status: $STATUS"

            case "$STATUS" in
              "Accepted")
                echo "✅ Notarization successful!"
                break
                ;;
              "Invalid"|"Rejected")
                echo "❌ Notarization failed with status: $STATUS"
                # Fetch log for debugging
                xcrun notarytool log "$SUBMISSION_ID" \
                  --apple-id "$APPLE_ID" \
                  --password "$APPLE_APP_PASSWORD" \
                  --team-id "$APPLE_TEAM_ID" \
                  notarization-log.json || true
                if [ -f notarization-log.json ]; then
                  echo "=== Notarization Log ==="
                  cat notarization-log.json
                fi
                exit 1
                ;;
              "In Progress"|"Unknown"|"Error")
                echo "Still processing or temporary error, will retry..."
                ;;
              *)
                echo "Unknown status: $STATUS, will retry..."
                ;;
            esac

            ATTEMPT=$((ATTEMPT + 1))
            # Increase wait time (exponential backoff with cap)
            WAIT_TIME=$((WAIT_TIME + 15))
            if [ $WAIT_TIME -gt $MAX_WAIT ]; then
              WAIT_TIME=$MAX_WAIT
            fi
          done

          # Final check
          if [ "$STATUS" != "Accepted" ]; then
            echo "❌ Notarization did not complete in time. Final status: $STATUS"
            # Try to fetch the log anyway
            xcrun notarytool log "$SUBMISSION_ID" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_APP_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              notarization-log.json 2>/dev/null || true
            if [ -f notarization-log.json ]; then
              echo "=== Notarization Log ==="
              cat notarization-log.json
            fi
            exit 1
          fi

          # Fetch log for successful notarization
          echo "=== Fetching notarization log ==="
          xcrun notarytool log "$SUBMISSION_ID" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            notarization-log.json || true

          if [ -f notarization-log.json ]; then
            echo "=== Notarization Log ==="
            cat notarization-log.json
            echo "========================"
          fi

          # Staple the notarization ticket
          echo "Stapling notarization ticket..."
          xcrun stapler staple VibeMobile.dmg

          # Verify
          echo "Verifying notarization..."
          spctl --assess --type open --context context:primary-signature -v VibeMobile.dmg || true
          echo "✅ Notarization complete!"

      - name: Upload notarization log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notarization-log
          path: notarization-log.json
          if-no-files-found: ignore

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VibeMobile-macOS
          path: VibeMobile.dmg

  release:
    name: Create Release
    needs: [build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: VibeMobile-macOS

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: VibeMobile ${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          files: |
            VibeMobile.dmg
          body: |
            ## VibeMobile ${{ steps.version.outputs.version }}

            Remote control for Claude Code sessions from your phone.

            ### Downloads

            | Platform | File | Requirements |
            |----------|------|--------------|
            | macOS | `VibeMobile.dmg` | macOS 12.0+, Node.js 18+, tmux |

            ### macOS Installation

            1. Download `VibeMobile.dmg`
            2. Open DMG and drag VibeMobile to Applications
            3. Run VibeMobile from Applications

            **Requirements:** `brew install node tmux`

            ### Usage

            1. Open VibeMobile app
            2. Click "Start Server"
            3. Click "New Session" to create a Claude Code session
            4. Connect from your phone: `http://YOUR_IP:8765`
            5. Pair your device using the 6-digit code

            See [README](https://github.com/${{ github.repository }}#readme) for full documentation.
