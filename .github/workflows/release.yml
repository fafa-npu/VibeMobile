name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: true
        default: 'v0.0.0'

jobs:
  build:
    name: Build macOS App with Bundled Server
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ===== Build Web Server =====
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Build web server
        working-directory: web
        run: npm run build

      # ===== Build macOS App =====
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Install Flutter dependencies
        working-directory: desktop
        run: flutter pub get

      - name: Build macOS app
        working-directory: desktop
        run: flutter build macos --release

      # ===== Bundle Server into App =====
      - name: Bundle server into app
        run: |
          APP_PATH="desktop/build/macos/Build/Products/Release/VibeMobile.app"
          SERVER_DIR="$APP_PATH/Contents/Resources/server"

          # Create server directory in app bundle
          mkdir -p "$SERVER_DIR"

          # Copy server files
          cp web/dist/server.cjs "$SERVER_DIR/"

          # Copy frontend static files (dist folder contents except server.cjs)
          mkdir -p "$SERVER_DIR/dist"
          cp -R web/dist/* "$SERVER_DIR/dist/" 2>/dev/null || true

          # Verify bundle
          echo "=== Bundled server files ==="
          ls -la "$SERVER_DIR/"
          echo "=== Bundled dist files ==="
          ls -la "$SERVER_DIR/dist/" | head -20

      # ===== Sign App (ad-hoc) =====
      - name: Sign app (ad-hoc)
        run: |
          APP_PATH="desktop/build/macos/Build/Products/Release/VibeMobile.app"

          # Remove any existing signatures and extended attributes
          xattr -cr "$APP_PATH"

          # Ad-hoc sign the app (allows it to run without "damaged" error)
          codesign --force --deep --sign - "$APP_PATH"

          # Verify the signature
          codesign --verify --verbose "$APP_PATH" || echo "Verification completed"

      # ===== Create DMG =====
      - name: Create DMG
        run: |
          cd desktop/build/macos/Build/Products/Release

          # Create a temporary directory for DMG contents
          mkdir -p dmg_contents
          cp -R VibeMobile.app dmg_contents/

          # Create symlink to Applications
          ln -s /Applications dmg_contents/Applications

          # Create DMG
          hdiutil create -volname "VibeMobile" \
            -srcfolder dmg_contents \
            -ov -format UDZO \
            VibeMobile.dmg

          # Move DMG to workspace root
          mv VibeMobile.dmg $GITHUB_WORKSPACE/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VibeMobile-macOS
          path: VibeMobile.dmg

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: VibeMobile-macOS

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: VibeMobile ${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          files: VibeMobile.dmg
          body: |
            ## VibeMobile ${{ steps.version.outputs.version }}

            Remote control for Claude Code sessions from your phone.

            ### Installation

            1. Download `VibeMobile.dmg`
            2. Open DMG and drag VibeMobile to Applications
            3. **First time only**: Right-click the app → Open → Click "Open" in the dialog
               (This is required because the app is not notarized by Apple)
            4. Run VibeMobile

            **That's it!** The server is bundled inside the app.

            ### Requirements

            - macOS 12.0+
            - Node.js 18+ (`brew install node`)
            - tmux (`brew install tmux`)

            ### Usage

            1. Open VibeMobile app
            2. Click "Start Server"
            3. Click "New Session" to create a Claude Code session
            4. Connect from your phone: `http://YOUR_MAC_IP:8765`
            5. Pair your device using the 6-digit code

            See [README](https://github.com/${{ github.repository }}#readme) for full documentation.
