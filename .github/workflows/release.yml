name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: true
        default: 'v0.0.0'

jobs:
  build-macos:
    name: Build macOS App with Bundled Server
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ===== Build Web Server =====
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Build web server
        working-directory: web
        run: npm run build

      # ===== Build macOS App =====
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Install Flutter dependencies
        working-directory: desktop
        run: flutter pub get

      - name: Build macOS app
        working-directory: desktop
        run: flutter build macos --release

      # ===== Bundle Server into App =====
      - name: Bundle server into app
        run: |
          APP_PATH="desktop/build/macos/Build/Products/Release/VibeMobile.app"
          SERVER_DIR="$APP_PATH/Contents/Resources/server"

          # Create server directory in app bundle
          mkdir -p "$SERVER_DIR"

          # Copy server files
          cp web/dist/server.cjs "$SERVER_DIR/"

          # Copy frontend static files (dist folder contents except server.cjs)
          mkdir -p "$SERVER_DIR/dist"
          cp -R web/dist/* "$SERVER_DIR/dist/" 2>/dev/null || true

          # Verify bundle
          echo "=== Bundled server files ==="
          ls -la "$SERVER_DIR/"
          echo "=== Bundled dist files ==="
          ls -la "$SERVER_DIR/dist/" | head -20

      # ===== Import Certificate =====
      - name: Import Code Signing Certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
        run: |
          # Create temporary keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          # Create keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import certificate
          echo "$CERTIFICATE_BASE64" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"

          # Add keychain to search list
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          # Allow codesign to access the key
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Verify certificate is available
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      # ===== Sign App with Developer ID =====
      - name: Sign app with Developer ID
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          APP_PATH="desktop/build/macos/Build/Products/Release/VibeMobile.app"
          SIGN_IDENTITY="Developer ID Application: Hua Zhao ($APPLE_TEAM_ID)"
          ENTITLEMENTS="desktop/macos/Runner/Release.entitlements"

          # Remove any existing signatures and extended attributes
          xattr -cr "$APP_PATH"

          echo "=== Signing nested components (inside-out) ==="

          # Sign all frameworks first (from innermost to outermost)
          find "$APP_PATH/Contents/Frameworks" -name "*.framework" -type d 2>/dev/null | while read framework; do
            echo "Signing framework: $framework"
            codesign --force --options runtime --sign "$SIGN_IDENTITY" "$framework"
          done

          # Sign all dylibs
          find "$APP_PATH" -name "*.dylib" -type f 2>/dev/null | while read dylib; do
            echo "Signing dylib: $dylib"
            codesign --force --options runtime --sign "$SIGN_IDENTITY" "$dylib"
          done

          # Sign all embedded executables in Helpers or MacOS subdirectories
          find "$APP_PATH/Contents" -type f -perm +111 ! -name "*.dylib" 2>/dev/null | while read exe; do
            # Skip the main executable, we'll sign it with the app
            if [[ "$exe" != "$APP_PATH/Contents/MacOS/"* ]]; then
              echo "Signing executable: $exe"
              codesign --force --options runtime --sign "$SIGN_IDENTITY" "$exe"
            fi
          done

          # Sign the main app bundle with entitlements
          echo "=== Signing main app bundle ==="
          codesign --force --options runtime \
            --entitlements "$ENTITLEMENTS" \
            --sign "$SIGN_IDENTITY" \
            "$APP_PATH"

          # Verify the signature
          echo "=== Verifying signature ==="
          codesign --verify --verbose=2 "$APP_PATH"

          # Check for any unsigned code
          echo "=== Checking for unsigned code ==="
          codesign --verify --deep --strict --verbose=2 "$APP_PATH" 2>&1 || true

          echo "App signed successfully!"

      # ===== Create and Sign DMG =====
      - name: Create and Sign DMG
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cd desktop/build/macos/Build/Products/Release

          # Create a temporary directory for DMG contents
          mkdir -p dmg_contents
          cp -R VibeMobile.app dmg_contents/

          # Create symlink to Applications
          ln -s /Applications dmg_contents/Applications

          # Create DMG
          hdiutil create -volname "VibeMobile" \
            -srcfolder dmg_contents \
            -ov -format UDZO \
            VibeMobile.dmg

          # Sign the DMG
          echo "Signing DMG..."
          codesign --force --sign "Developer ID Application: Hua Zhao ($APPLE_TEAM_ID)" VibeMobile.dmg

          # Verify DMG signature
          codesign --verify --verbose VibeMobile.dmg

          # Move DMG to workspace root
          mv VibeMobile.dmg $GITHUB_WORKSPACE/

      # ===== Validate Code Signing Before Notarization =====
      - name: Validate code signing before notarization
        run: |
          echo "=== Validating DMG signature ==="
          codesign --verify --deep --strict --verbose=2 VibeMobile.dmg

          echo "=== Checking app bundle inside DMG ==="
          # Mount DMG temporarily
          hdiutil attach VibeMobile.dmg -mountpoint /tmp/dmg_mount -nobrowse

          echo "=== App code signature ==="
          codesign --verify --deep --strict --verbose=2 /tmp/dmg_mount/VibeMobile.app

          echo "=== App entitlements ==="
          codesign -d --entitlements :- /tmp/dmg_mount/VibeMobile.app

          echo "=== Gatekeeper assessment ==="
          spctl --assess --type execute --verbose=2 /tmp/dmg_mount/VibeMobile.app 2>&1 || true

          # Unmount
          hdiutil detach /tmp/dmg_mount

          echo "=== Validation complete ==="

      # ===== Notarize DMG =====
      - name: Notarize DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        timeout-minutes: 60
        run: |
          echo "=== Submitting for notarization ==="

          # Submit and wait with built-in timeout (55 minutes to leave room for stapling)
          xcrun notarytool submit VibeMobile.dmg \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait \
            --timeout 55m \
            2>&1 | tee notarization-output.txt

          # Save submission ID for artifacts
          SUBMISSION_ID=$(grep -o 'id: [a-f0-9-]*' notarization-output.txt | head -1 | cut -d' ' -f2 || true)
          if [ -n "$SUBMISSION_ID" ]; then
            echo "$SUBMISSION_ID" > submission-id.txt
            echo "SUBMISSION_ID=$SUBMISSION_ID" >> $GITHUB_ENV
          fi

          # Check result
          if grep -q "status: Accepted" notarization-output.txt; then
            echo "✅ Notarization successful!"

            # Staple the ticket
            echo "Stapling notarization ticket..."
            xcrun stapler staple VibeMobile.dmg

            # Validate stapling
            echo "Validating stapled DMG..."
            xcrun stapler validate VibeMobile.dmg

            echo "✅ Notarization and stapling complete!"
          else
            echo "❌ Notarization failed or timed out"
            echo "=== Full output ==="
            cat notarization-output.txt

            # Extract submission ID for log retrieval if we have it
            if [ -n "$SUBMISSION_ID" ]; then
              echo "Fetching detailed log for submission: $SUBMISSION_ID"
              xcrun notarytool log "$SUBMISSION_ID" \
                --apple-id "$APPLE_ID" \
                --password "$APPLE_APP_PASSWORD" \
                --team-id "$APPLE_TEAM_ID" \
                notarization-log.json 2>&1 || true

              if [ -f notarization-log.json ]; then
                echo "=== Notarization Log ==="
                cat notarization-log.json
              fi
            fi

            exit 1
          fi

      - name: Upload notarization log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notarization-log
          path: notarization-log.json
          if-no-files-found: ignore

      - name: Upload submission ID
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notarization-submission-id
          path: submission-id.txt
          if-no-files-found: ignore

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VibeMobile-macOS
          path: VibeMobile.dmg

  build-windows:
    name: Build Windows App with Bundled Server
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ===== Build Web Server =====
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Build web server
        working-directory: web
        run: npm run build

      # ===== Build Windows App =====
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Install Flutter dependencies
        working-directory: desktop
        run: flutter pub get

      - name: Build Windows app
        working-directory: desktop
        run: flutter build windows --release

      # ===== Bundle Server into App =====
      - name: Bundle server into app
        shell: pwsh
        run: |
          $APP_PATH = "desktop\build\windows\x64\runner\Release"
          $SERVER_DIR = "$APP_PATH\server"

          # Create server directory
          New-Item -ItemType Directory -Force -Path $SERVER_DIR

          # Copy server files
          Copy-Item "web\dist\server.cjs" -Destination $SERVER_DIR

          # Copy frontend static files
          New-Item -ItemType Directory -Force -Path "$SERVER_DIR\dist"
          Copy-Item -Recurse "web\dist\*" -Destination "$SERVER_DIR\dist\" -Force

          # Verify bundle
          Write-Host "=== Bundled server files ==="
          Get-ChildItem $SERVER_DIR

      # ===== Create ZIP Archive =====
      - name: Create ZIP archive
        shell: pwsh
        run: |
          $APP_PATH = "desktop\build\windows\x64\runner\Release"
          Compress-Archive -Path "$APP_PATH\*" -DestinationPath "VibeMobile-Windows.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VibeMobile-Windows
          path: VibeMobile-Windows.zip

  release:
    name: Create Release
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: VibeMobile-macOS

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: VibeMobile-Windows

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: VibeMobile ${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          files: |
            VibeMobile.dmg
            VibeMobile-Windows.zip
          body: |
            ## VibeMobile ${{ steps.version.outputs.version }}

            Remote control for Claude Code sessions from your phone.

            ### Downloads

            | Platform | File | Requirements |
            |----------|------|--------------|
            | macOS | `VibeMobile.dmg` | macOS 12.0+, Node.js 18+, tmux |
            | Windows | `VibeMobile-Windows.zip` | Windows 10+, Node.js 18+ |

            ### macOS Installation

            1. Download `VibeMobile.dmg`
            2. Open DMG and drag VibeMobile to Applications
            3. **First time only:** Right-click on VibeMobile.app and select "Open" to bypass Gatekeeper
            4. Run VibeMobile from Applications

            **Requirements:** `brew install node tmux`
            
            **Note:** The DMG is code-signed with a Developer ID but may not be notarized if Apple's notarization service was slow. If you see a "damaged" or "unverified developer" error with a non-notarized app, run:
            ```bash
            xattr -cr /Applications/VibeMobile.app
            ```

            ### Windows Installation

            1. Download `VibeMobile-Windows.zip`
            2. Extract to a folder (e.g., `C:\Program Files\VibeMobile`)
            3. Run `vibemobile.exe`

            **Requirements:** Install Node.js from [nodejs.org](https://nodejs.org) or via `winget install OpenJS.NodeJS.LTS`

            ### Usage

            1. Open VibeMobile app
            2. Click "Start Server"
            3. Click "New Session" to create a Claude Code session
            4. Connect from your phone: `http://YOUR_IP:8765`
            5. Pair your device using the 6-digit code

            See [README](https://github.com/${{ github.repository }}#readme) for full documentation.
